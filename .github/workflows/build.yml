name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Short commit hash
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The version suffix makes a continuous build recognisable in the app header (v0.5.0-nightly.abc1234).
      - name: Publish
        run: dotnet publish src/TomLabs.IISBlitz.App/TomLabs.IISBlitz.App.csproj -c Release -r ${{ matrix.runtime }} -p:VersionSuffix=nightly.${{ steps.sha.outputs.short }} -o publish/${{ matrix.runtime }}

      - name: Zip artifact
        run: Compress-Archive -Path publish/${{ matrix.runtime }}/* -DestinationPath IISBlitz-${{ matrix.runtime }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IISBlitz-${{ matrix.runtime }}
          path: IISBlitz-${{ matrix.runtime }}.zip

  nightly:
    name: Publish nightly pre-release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Move the rolling tag to the current commit so the release page shows the right source.
      - name: Move nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: |
            Continuous build of `master` at ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            Stable download links:
            - https://github.com/${{ github.repository }}/releases/download/nightly/IISBlitz-win-x64.zip
            - https://github.com/${{ github.repository }}/releases/download/nightly/IISBlitz-win-arm64.zip
          files: artifacts/**/*.zip
