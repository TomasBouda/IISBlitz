name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build src/TomLabs.IISBlitz.App/TomLabs.IISBlitz.App.csproj -c Release

  # Every push to master refreshes the "nightly" pre-release (zips + update.json for the in-app updater).
  nightly:
    if: github.event_name == 'push'
    uses: TomasBouda/TomLabs.AutoUpdate/.github/workflows/publish-app.yml@master
    with:
      project: src/TomLabs.IISBlitz.App/TomLabs.IISBlitz.App.csproj
      app-name: IISBlitz
      channel: nightly
