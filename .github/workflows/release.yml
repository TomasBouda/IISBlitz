name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: TomasBouda/TomLabs.AutoUpdate/.github/workflows/publish-app.yml@master
    with:
      project: src/TomLabs.IISBlitz.App/TomLabs.IISBlitz.App.csproj
      app-name: IISBlitz
      channel: stable
    secrets:
      signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
